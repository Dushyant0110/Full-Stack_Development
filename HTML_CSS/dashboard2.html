<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }

        .dashboard {
            width: 90%;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 10px 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 100px 150px 100px;
            gap: 10px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .box1 {
            background-color: blueviolet;
            grid-column: 1 / 5;
        }

        .box2 {
            background-color: green;
            grid-row: 2 / 4;
        }

        .box3 {
            background-color: yellow;
            grid-column: 2 / 5;
        }

        .box4 {
            background-color: pink;
        }

        .box5 {
            background-color: pink;
        }

        .box6 {
            background-color: purple;
            color: white;
        }
        @media (max-width: 900px) {

            .container {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .box {
                height: 120px;
                flex: 1 1 45%;
            }

            .box1 {
                flex: 1 1 100%;
            }

            .box2 {
                flex: 1 1 45%;
            }

            .box3 {
                flex: 1 1 45%;
            }
        }

        @media (max-width: 600px) {

            .dashboard {
                width: 85%;
            }

            .heading {
                flex-direction: column;
                gap: 10px;
            }

            .heading h1 {
                text-align: center;
                font-size: 24px;
            }

            .container {
                display: flex;
                flex-direction: column;
            }

            .box {
                width: 100%;
                height: 100px;
                flex: none;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="heading">
            <h1>TASK 3 - MAGAZINE LAYOUT</h1>
            <button>Click Me</button>
        </div>

        <div class="container">

            <div class="box box1">HEADER</div>
            <div class="box box2">SIDEBAR</div>
            <div class="box box3">CONTENT</div>
            <div class="box box4">CARD 1</div>
            <div class="box box5">CARD 2</div>
            <div class="box box6">FOOTER</div>

        </div>

    </div>

</body>
</html>
