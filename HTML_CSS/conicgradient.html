<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Gradient</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            text-align: center;
        }

        .pie {
            width: 250px;
            height: 250px;
            border-radius: 50%;

            background: conic-gradient(
                green ,
                red,
                blue,
                green 
            );

            margin: 20px auto;
        }

        h1 {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Conic Gradient</h1>

        <div class="pie"></div>

        <p>Red: 33% | Blue: 33% | Green: 33%</p>
    </div>

</body>
</html>
