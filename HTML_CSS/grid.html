<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(100px,1fr));
            
            gap: 2px;
            grid-template-areas: 
            "box1 box2 box2"
            "box3 box3 box6"
            "box4 box5 box6"
            "box7 box8 box9";
        }
        @media (max-width : 500px){
            .container{
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(100px,1fr));
            
                gap: 2px;
                grid-template-areas: 
                "box1 box3 "
                "box9 box7 "
                "box6 box5 "
                "box2 box2 "
                "box4";
        }

        }
        .box{
            background-color: teal;
            min-height: 100px;
            color: wheat;
            font-size: 20px;
            text-align: center;
        }
        .div{
            display: block;
            unicode-bidi: isolate;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class  = "container">
        <div class="box" style="grid-area: box1;">1</div>
        <div class="box" style="grid-area: box2;">2</div>
        <div class="box" style="grid-area: box3;">3</div>
        <div class="box" style="grid-area: box4;">4</div>
        <div class="box" style="grid-area: box5;">5</div>
        <div class="box" style="grid-area: box6;">6</div>
        <div class="box" style="grid-area: box7;">7</div>
        <div class="box" style="grid-area: box8;">8</div>
        <div class="box" style="grid-area: box9;">9</div>
             

    </div>
    
</body>
</html>
